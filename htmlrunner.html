<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HTML Runner</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
}
#editor{
    width:100%;
    height:calc(100% - 50px);
    box-sizing:border-box;
    font-family:monospace;
}
#go{
    width:100%;
    height:50px;
    font-size:20px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>

<script>
const p = new URLSearchParams(location.search).get("p");

if (p) {
    document.open();
    document.write(
        LZString.decompressFromEncodedURIComponent(p)
    );
    document.close();
} else {
    document.body.innerHTML = `
<textarea id="editor" placeholder="HTMLを入力"></textarea>
<button id="go">GO</button>
`;

    go.onclick = () => {
        const code = LZString.compressToEncodedURIComponent(
            editor.value
        );
        location.search = "?p=" + code;
    };
}
</script>

</body>
</html>
